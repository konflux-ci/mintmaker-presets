name: Validate presets

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      presets: ${{ steps.list.outputs.presets }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        name: List preset JSON files
        run: |
          presets=$(ls *.json | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "presets=$presets" >> "$GITHUB_OUTPUT"
          echo "Found presets: $presets"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    name: Validate presets
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJson(needs.discover.outputs.presets) }}
    steps:
      - uses: actions/checkout@v6
      # Inline validator (same image/command as renovate-config-validator-action)
      # so we can capture WARN lines and emit GitHub annotations.
      - name: Validate ${{ matrix.preset }}
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          IMAGE=quay.io/konflux-ci/mintmaker-renovate-image:latest
          config_path="${GITHUB_WORKSPACE}/${PRESET}"

          if command -v podman >/dev/null 2>&1; then
            RUNTIME=podman
            MOUNT_OPTS="ro,Z"
          else
            RUNTIME=docker
            MOUNT_OPTS="ro"
          fi

          set +e
          output="$($RUNTIME run --rm \
            -v "${config_path}:/workspace/renovate.json:${MOUNT_OPTS}" \
            "$IMAGE" \
            renovate-config-validator /workspace/renovate.json 2>&1)"
          exit_code=$?
          set -e

          printf '%s\n' "$output"

          if printf '%s\n' "$output" | grep -q 'WARN:'; then
            echo "::warning file=${PRESET},title=Renovate config validation::Validation reported warnings for ${PRESET}. See the job log for details."
          fi

          exit "${exit_code}"
