name: Validate presets

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      presets: ${{ steps.list.outputs.presets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: list
        name: List preset JSON files
        run: |
          presets=$(ls *.json | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "presets=$presets" >> "$GITHUB_OUTPUT"
          echo "Found presets: $presets"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    name: Validate presets
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJson(needs.discover.outputs.presets) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate ${{ matrix.preset }}
        uses: konflux-ci/renovate-config-validator-action@1891cfbf5e12443366e799383d6b8141310883b8 # main
        with:
          config_file: ${{ matrix.preset }}
          strict: true
